org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 本机构建适配（不改变任何应用行为）：
# Kotlin 编译守护进程在本机会因 GC 自动选择（Parallel GC）崩溃终止，
# Gradle 随后退回「进程内编译」通道，而该通道在中文用户名路径下会把
# 「怡」写成字面量 u6021，报 plugin classpath non-existent location 编译失败。
# 显式固定守护进程 JVM 参数 + 堆上限，保证走守护进程通道：
kotlin.daemon.jvmargs=-Xmx3072m -XX:-UseParallelGC -Dfile.encoding=UTF-8
